# Étapes de la mise à jour (update_all.py), dans l'ordre d'exécution. Chaque étape = un script indépendant ; si son fichier
# est invalide (validate_data.py) ou plus ancien que la version publiée, l'ancienne version est restaurée.
# label = nom affiché ; label_inline = même nom au fil d'une phrase
# attempts = essais ; waits = attentes entre essais (secondes) ; restore = fichiers à restaurer en cas d'échec
# freshness : contrôle de fraîcheur (min_rows = nombre minimal de lignes, max_age = âge max de la dernière date en jours,
#             max_gap = plus grand trou toléré entre deux dates en jours ; week-ends et jours fériés tolérés)

[history]
# historique Polygon (fetch_history.py, cache hors dépôt) : séances complétées à chaque passage et séances gardées au plus.
# 190 (décision du 18/10/2026) : courbes du TI65 sur ~6 mois dans la vue TradingView (190 − 64 = 126 séances) ; couvre
# aussi le calcul maison du breadth (fenêtre trimestrielle). Augmenter = rattrapage unique, réparti sur plusieurs passages
# (max_downloads) ; 5 appels/min sur le plan gratuit, soit 1 séance = 12 s.
# 490 (décision du 28/10/2026) : calcul maison du breadth depuis fin 2024 pour rejouer les phases de marché sur 2025 (choc
# d'avril, surchauffe de mai) et caler leurs seuils sur notre univers. Le plan gratuit remonte à 2 ans : rester sous ~500.
# Rattrapage : ~300 séances, 100 par passage (3 à 4 passages du matin). Les agrégats restent dans breadth_data.js.
sessions = 490
keep = 500
rate = 5               # appels par minute (plan gratuit Polygon / Massive)
max_downloads = 100    # séances téléchargées au plus par passage (≈ 20 min) : un passage tient toujours avant le suivant

[stockbee]
# Market Monitor de Stockbee (fetch_stockbee.py) : Google Sheet publié, un onglet par année (même disposition de colonnes).
# ⚠️ Chaque janvier, Stockbee ouvre un onglet pour la nouvelle année : ajouter ici son gid (lien « Publier sur le web » de
# l'onglet, paramètre gid=…), sinon la série s'arrête au 31/12 (`--check` signale l'année manquante dès le 1er janvier).
sheet = "1O6OhS7ciA8zwfycBfGPbP2fWJnR0pn2UUvFZVDP9jpE"
gids = { "2019" = 1089581064, "2020" = 2093835319, "2021" = 1981550515, "2022" = 1394777987, "2023" = 632667710, "2024" = 1146204629, "2025" = 780188096, "2026" = 1082103394 }
timeout = 60                  # secondes par onglet

[breadth_soir]
# Calcul maison du soir (breadth_soir.py, postmarket.yml, décision du 28/10/2026) : séance du jour = cache Polygon jusqu'à la
# veille + clôtures du screener TradingView, mêmes formules que breadth_own.py ; ligne provisoire jusqu'au calcul Polygon.
match_tol = 0.005             # clôture de la veille TradingView et dernière clôture en cache « identiques » à 0,5 % près
min_match = 0.9               # part des titres identiques exigée : sinon le cache n'est pas à la veille (rien n'est écrit)
split_min = 1.2               # écart d'au moins 1,2 (ou 1 / 1,2) = split du jour ; entre les deux : titre ignoré
min_coverage = 0.9            # part des titres cotés la veille retrouvés sur TradingView (≈ 97 % mesurés le 28/10/2026)

[tv_breadth]
# T2108 relevé sur le screener TradingView (fetch_tv_breadth.py) : seconde source maison, comparée à Stockbee (décision du
# 20/10/2026). Univers = actions ordinaires des trois bourses (≈ 5 130 avec une SMA 40 en octobre 2026 ; Worden ≈ 6 550).
market = "america"
type = "stock"
subtype = "common"
exchanges = ["NYSE", "NASDAQ", "AMEX"]
sma = 40                      # moyenne mobile du T2108 (champ SMA40 du screener)
scan_limit = 20000            # lignes demandées ; atteinte = liste peut-être tronquée, relevé refusé
min_stocks = 3000             # en dessous : réponse incomplète, relevé refusé
delay_minutes = 20            # après la clôture : données différées de 15 min sans compte (+5 min de marge)
sessions_ok = ["post_market", "out_of_session"]   # états du screener où la bougie du jour est close (pas en séance ni pre-market)

[tv_breadth.breakouts]
# Liste « 9M +4 % » de l'onglet Secteurs (exception au gel accordée le 27/10/2026) : scan TC2000 de l'utilisateur, appliqué
# au même relevé du screener (aucune requête de plus) : C / C1 >= 1 + pct / 100, V > min_volume, V > V1 si volume_up.
# min_price : condition TC2000 « Price History > 0,8 » = clôture supérieure à 0,80 $ (confirmé par l'utilisateur le 27/10/2026).
label = "Breakouts 9M +4 %"
short_label = "Breakouts 9M"     # fil du Classement et bouton du bloc (liste, graphique et fiche)
pct = 4                       # hausse minimale sur la clôture de la veille (%)
min_volume = 8_900_000        # volume du jour strictement supérieur (TC2000 : v >= 8900000 et v > 8900000)
volume_up = true              # volume du jour > volume de la veille (TC2000 : v > v1)
min_price = 0.8               # clôture strictement supérieure (TC2000 : Price History > 0,8)
keep_sessions = 63            # séances gardées dans tv_breadth_data.js (≈ 3 mois ; la liste commence au premier relevé)
list_limit = 30               # onglet Secteurs : titres affichés avant « + N autres »
# extra / extra_exchanges : ajoutés à cette liste seulement (T2108 et ±4 % : actions ordinaires des bourses de [tv_breadth]),
# comme TC2000 (choix de l'utilisateur du 27/10/2026) : "type" ou "type/sous-type" TradingView ; "dr" = ADR (STM, ASX…),
# "fund/etf" = ETF (DRAM, KORU…), cotés aussi sur CBOE (DRAM, SNXX, CBRG)
extra = ["dr", "fund/etf"]
extra_exchanges = ["CBOE"]
universe_label = "actions ordinaires, ADR et ETF de NYSE, Nasdaq, AMEX et CBOE"   # bulle ⓘ du bloc
sort = "dvol"                 # ordre de la liste (Secteurs et Tickers) : "dvol" = volume en dollars du jour (clôture × volume,
                              # choix de l'utilisateur du 27/10/2026), du plus haut au plus bas ; "pct" = hausse du jour

