# Étapes de la mise à jour (update_all.py), dans l'ordre d'exécution. Chaque étape = un script indépendant ; si son fichier
# est invalide (validate_data.py) ou plus ancien que la version publiée, l'ancienne version est restaurée.
# label = nom affiché ; label_inline = même nom au fil d'une phrase
# attempts = essais ; waits = attentes entre essais (secondes) ; restore = fichiers à restaurer en cas d'échec
# freshness : contrôle de fraîcheur (min_rows = nombre minimal de lignes, max_age = âge max de la dernière date en jours,
#             max_gap = plus grand trou toléré entre deux dates en jours ; week-ends et jours fériés tolérés)

[history]
# historique Polygon (fetch_history.py, cache hors dépôt) : séances complétées à chaque passage et séances gardées au plus.
# 190 (décision du 18/10/2026) : courbes du TI65 sur ~6 mois dans la vue TradingView (190 − 64 = 126 séances) ; couvre
# aussi le calcul maison du breadth (fenêtre trimestrielle). Augmenter = rattrapage unique, réparti sur plusieurs passages
# (max_downloads) ; 5 appels/min sur le plan gratuit, soit 1 séance = 12 s.
sessions = 190
keep = 400
rate = 5               # appels par minute (plan gratuit Polygon / Massive)
max_downloads = 100    # séances téléchargées au plus par passage (≈ 20 min) : un passage tient toujours avant le suivant

[tv_breadth]
# T2108 relevé sur le screener TradingView (fetch_tv_breadth.py) : seconde source maison, comparée à Stockbee (décision du
# 20/10/2026). Univers = actions ordinaires des trois bourses (≈ 5 130 avec une SMA 40 en octobre 2026 ; Worden ≈ 6 550).
market = "america"
type = "stock"
subtype = "common"
exchanges = ["NYSE", "NASDAQ", "AMEX"]
sma = 40                      # moyenne mobile du T2108 (champ SMA40 du screener)
scan_limit = 20000            # lignes demandées ; atteinte = liste peut-être tronquée, relevé refusé
min_stocks = 3000             # en dessous : réponse incomplète, relevé refusé
delay_minutes = 20            # après la clôture : données différées de 15 min sans compte (+5 min de marge)
sessions_ok = ["post_market", "out_of_session"]   # états du screener où la bougie du jour est close (pas en séance ni pre-market)

[[step]]
name = "stockbee"
label = "Stockbee"
label_inline = "Stockbee"   # dans une phrase (« … en échec »)
script = "fetch_stockbee.py"
output = "stockbee_data.js"
restore = ["stockbee_data.js", "stockbee_market_monitor.csv"]
attempts = 3
waits = [30, 90]
freshness = { min_rows = 1500, max_age = 6, max_gap = 12 }

[[step]]
name = "breadth"
label = "Calcul maison"
label_inline = "calcul maison"   # dans une phrase (« … en échec »)
script = "breadth_own.py"
output = "breadth_data.js"
restore = ["breadth_data.js"]
attempts = 1
waits = [0]
freshness = { min_rows = 10, max_age = 6, max_gap = 12 }

[[step]]
name = "tv_breadth"
label = "T2108 TradingView"
label_inline = "T2108 TradingView"   # dans une phrase (« … en échec »)
script = "fetch_tv_breadth.py"        # aussi lancé par postmarket.yml (relevé dès la fin de séance)
output = "tv_breadth_data.js"
restore = ["tv_breadth_data.js"]
attempts = 2
waits = [30]
freshness = { min_rows = 0, max_age = 6, max_gap = 12 }   # min_rows = 0 : la série démarre le 20/10/2026, un relevé par séance

[[step]]
name = "vix"
label = "VIX"
label_inline = "VIX"   # dans une phrase (« … en échec »)
script = "fetch_vix.py"
output = "vix_data.js"
restore = ["vix_data.js"]
attempts = 3
waits = [30, 90]
freshness = { min_rows = 1500, max_age = 6, max_gap = 12 }

[[step]]
name = "prices"
label = "Prix"
label_inline = "prix"   # dans une phrase (« … en échec »)
script = "fetch_prices.py"
output = "prices_data.js"
restore = ["prices_data.js"]
attempts = 3
waits = [60, 180]          # Yahoo : 429 possibles depuis une IP de serveur
freshness = { min_rows = 1500, max_age = 5, max_gap = 8, btc_min_rows = 2500, btc_max_age = 3, btc_max_gap = 3 }

[[step]]
name = "sectors"
label = "Secteurs"
label_inline = "secteurs"   # dans une phrase (« … en échec »)
script = "fetch_sectors.py"
output = "sectors_data.js"
restore = ["sectors_data.js"]
attempts = 3
waits = [60, 180]
freshness = { min_rows = 250, max_age = 6, max_gap = 12, min_symbols = 50 }

[[step]]
name = "postmarket"
label = "Post-market"
label_inline = "post-market"   # dans une phrase (« … en échec »)
script = "fetch_postmarket.py"
output = "postmarket_data.js"
restore = ["postmarket_data.js"]
attempts = 2
waits = [30]
freshness = { max_age = 7, max_gap = 20, max_snapshots = 30 }

[[step]]
name = "industries"
label = "Industries TradingView"
label_inline = "industries TradingView"   # dans une phrase (« … en échec »)
script = "fetch_industries.py"            # après fetch_history.py (clôtures Polygon en cache) ; scanner TradingView
output = "industries_data.js"
restore = ["industries_data.js", "industries/", "tickers_data.js"]   # « / » final : tout le dossier ; tickers : onglet Tickers
attempts = 2
waits = [30]
freshness = { min_rows = 70, max_age = 6, max_gap = 12, min_sectors = 15, min_industries = 80, min_stocks = 1500 }

[[step]]
name = "short"
label = "Short interest"
label_inline = "short interest"   # dans une phrase (« … en échec »)
script = "fetch_short.py"         # Yahoo (yfinance), par lots : config/short.toml
output = "short_data.js"
restore = ["short_data.js"]
attempts = 1
waits = [0]
separate = "short.yml"            # lancé par son propre workflow l'après-midi, pas par update_all.py
freshness = { max_age = 10, min_rows = 500 }
