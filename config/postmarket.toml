# Scan post-market (fetch_postmarket.py, screener public TradingView, différé de 15 min) = preset TradingView de l'utilisateur.
# Chaque relevé REMPLACE la liste de la séance (un titre repassé sous le seuil ne correspond plus au scan : il en sort).
min_price = 3            # clôture > 3 $
min_volume = 100000      # volume post-market > 100 000 actions
min_change = 4           # variation post-market > +4 % (hausses) ou < -4 % (baisses)
max_per_side = 150       # titres par sens ; limite atteinte = liste marquée « tronquée »
keep_sessions = 20       # séances gardées dans postmarket_data.js (l'historique complet viendra du stockage, refonte phase 3)
chart_bars = 65          # bougies journalières (~3 mois) pour la fiche détail

# Liens de la fiche d'un titre, dans cet ordre, ouverts dans un nouvel onglet.
# {sym} = symbole (LQDA) ; {tv} = symbole TradingView avec la place de cotation (NASDAQ:LQDA).
# Dépôts SEC sans filtre de type : les émetteurs étrangers déposent des 6-K, pas des 8-K.
[[links]]
label = "TradingView"
url = "https://www.tradingview.com/chart/?symbol={tv}"

[[links]]
label = "News Benzinga"
url = "https://www.benzinga.com/quote/{sym}/news"

[[links]]
label = "Dépôts SEC"
url = "https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&CIK={sym}&owner=include&count=40"

# Étiquettes de suivi (onglet Post-market, gardées sur l'appareil). La 1re est celle de l'étoile de la liste ;
# les autres se choisissent dans la fiche. tone = couleur du thème : warn, up, down ou muted.
[[tags]]
id = "suivre"
icon = "★"
label = "À suivre"
tone = "warn"

[[tags]]
id = "setup"
icon = "⚑"
label = "Setup"
tone = "up"

[[tags]]
id = "piege"
icon = "✕"
label = "Piège"
tone = "down"
