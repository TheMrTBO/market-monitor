# Vue « TradingView » de l'onglet Secteurs : secteurs → industries → actions, chaque niveau classé par TI65.
# Classification : scanner public TradingView (champs sector, industry ; sans compte, sans clé).
# Clôtures : historique Polygon de fetch_history.py (clôtures brutes + splits, cache hors dépôt).
# Secteur et industrie = indice équipondéré de leurs actions retenues (variations journalières moyennes, chaînées) ;
# la composition est celle du jour du calcul, appliquée à tout l'historique. Réglages calibrés le 18/10/2026.

[universe]
market = "america"            # marché du scanner TradingView
type = "stock"                # type d'instrument du scanner (les ETF et fonds sont exclus)
scan_limit = 20000            # lignes demandées au scanner (≈ 5 700 en octobre 2026) ; atteinte = liste tronquée, refusée
exchanges = ["NYSE", "NASDAQ", "AMEX"]
subtype = "common"            # actions ordinaires (TradingView) ; il faut aussi qu'elles soient dans l'univers Polygon (type CS)
min_price = 3.0               # dernière clôture, dollars
min_avg_volume = 100_000      # volume moyen (actions) sur avg_volume_sessions séances
avg_volume_sessions = 50
min_market_cap = 300_000_000  # dollars (capitalisation TradingView)

[index]
base = 100                    # valeur de départ des indices
daily_return_clip = 0.5       # variation journalière d'un titre plafonnée à ±50 % dans le calcul de l'indice
min_members = 3               # en dessous : secteur ou industrie affiché sans rang
few_members = 5               # en dessous : étiquette « peu de titres »

[volume]
# volume en dollars relatif (cours × volume, ajustés des splits) d'un secteur, d'une industrie et de toutes les actions retenues :
# moyenne des `short` dernières séances ÷ moyenne des `long` dernières (1,3 = 30 % d'argent échangé de plus que d'habitude).
# Sert à la carte de rotation de l'onglet Secteurs (décision du 20/10/2026 : « où va l'argent »).
short = 5
long = 50

[leaders]
# Leaders et groupes actifs de l'onglet Secteurs (refonte du 27/10/2026, tests 5 à 16 du document d'analyse ; exception au gel
# accordée le 27/10/2026 à la demande de l'utilisateur). Leader = action retenue en hausse d'au moins gain_pct % sur `sessions` séances.
gain_pct = 25
sessions = 21
# grappe d'une industrie (son signal « neuf ») : au moins grappe_min leaders, et une part de leaders au moins grappe_ratio fois
# celle de toutes les actions retenues. Signal le plus solide des tests : 53 % devant le marché à 42 séances, sur 2019-2023 et 2024-2026.
grappe_min = 3
grappe_ratio = 2.0
theme_share_pct = 50          # signal d'un thème (config/themes.toml) : au moins cette part de son panier est leader
list_sessions = 63            # séances dont la liste des leaders est écrite dans industries_data.js (clé « leaders »)

[output]
stock_sessions = 190          # séances par action dans industries/<industrie>.js (fiche action : graphique, TI65 sur ~6 mois)
folder = "industries"         # un fichier par industrie, chargé à l'ouverture de l'industrie
volume_unit = 1000            # volumes des actions écrits en milliers (fichiers plus légers) ; l'unité est écrite dans le fichier
tickers_file = "tickers_data.js"   # index de toutes les actions US (onglet Tickers) ; sert aussi de composition de secours
publish_all = true            # cours (bougies) aussi pour les actions hors filtres : fiche avec graphique dans l'onglet Tickers
extra_suffix = "--hors"       # fichier de ces actions : industries/<industrie><suffixe>.js (chargé seulement pour leur fiche)
