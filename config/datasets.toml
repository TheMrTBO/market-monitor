# MODÈLE LOGIQUE des données (refonte phase 3, pas encore utilisé par le code). Indépendant du stockage physique :
# chaque jeu = une future table SQL. Noms en snake_case, dates ISO (AAAA-MM-JJ), horodatages UTC, types :
# date, timestamp, int, float, text, bool ; « ? » = valeur absente autorisée. primary_key = unicité (upsert idempotent).
# partition = découpage des fichiers en stockage git_csv (month = un fichier par mois, day = un fichier par jour).

[datasets.stockbee_daily]
description = "Breadth Stockbee (Market Monitor), une ligne par séance"
primary_key = ["session_date"]
partition = "month"
columns = { session_date = "date", up4 = "int?", down4 = "int?", ratio5 = "float?", ratio10 = "float?", up25q = "int?", down25q = "int?", up25m = "int?", down25m = "int?", up50m = "int?", down50m = "int?", up13_34d = "int?", down13_34d = "int?", universe = "int?", t2108 = "float?", sp500 = "float?" }

[datasets.breadth_own_daily]
description = "Calcul maison du breadth (clôtures Polygon / Massive)"
primary_key = ["session_date"]
partition = "month"
columns = { session_date = "date", up4 = "int", down4 = "int", ratio5 = "float?", ratio10 = "float?", up25m = "int?", down25m = "int?", up25q = "int?", down25q = "int?", t2108 = "float?" }

[datasets.prices_daily]
description = "Bougies journalières QQQ, IWM (Yahoo) et BTC (Coinbase)"
primary_key = ["symbol", "session_date"]
partition = "month"
columns = { symbol = "text", session_date = "date", open = "float", high = "float", low = "float", close = "float", volume = "float" }

[datasets.sectors_daily]
description = "Bougies journalières des ETF de config/sectors.toml (Yahoo)"
primary_key = ["symbol", "session_date"]
partition = "month"
columns = { symbol = "text", session_date = "date", open = "float?", high = "float?", low = "float?", close = "float?", volume = "int?" }

[datasets.vix_daily]
description = "VIX (CBOE)"
primary_key = ["session_date"]
partition = "month"
columns = { session_date = "date", open = "float", high = "float", low = "float", close = "float" }

[datasets.postmarket_scan]
description = "Chaque relevé du scan post-market (toutes les 15 min) : ce que montrait le scan à l'heure du relevé"
primary_key = ["session_date", "taken_at", "ticker"]
partition = "day"
columns = { session_date = "date", taken_at = "timestamp", closed = "bool", ticker = "text", symbol = "text", name = "text", sector = "text?", industry = "text?", close = "float?", change_pct = "float?", pm_price = "float?", pm_change_pct = "float?", pm_volume = "int", rvol = "float?", market_cap = "int?", float_shares = "int?", earnings = "text?" }

[datasets.postmarket_session]
description = "Liste finale d'une séance + séance suivante (vue dérivée de postmarket_scan)"
primary_key = ["session_date", "ticker"]
partition = "month"
columns = { session_date = "date", ticker = "text", last_taken_at = "timestamp", pm_change_pct = "float", pm_volume = "int", next_change_pct = "float?", next_gap_pct = "float?" }

[datasets.runs]
description = "Journal des passages : statut par source, dernière séance obtenue, heure de 1re disponibilité (calage des horaires)"
primary_key = ["run_id", "source"]
partition = "month"
columns = { run_id = "text", source = "text", started_at = "timestamp", duration_s = "float", ok = "bool", attempts = "int", last_session = "date?", note = "text?" }
