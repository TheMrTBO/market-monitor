# Thèmes suivis par l'onglet Secteurs (refonte du 27/10/2026) : un panier d'actions par thème, suivi comme une industrie
# (indice équipondéré, TI65, largeur, leaders). Sert surtout aux thèmes dilués dans une grande industrie TradingView (espace,
# drones, crypto, logiciel IA…), que la grappe d'industrie ne voit pas à temps (test 7 du document d'analyse).
# Principe : le dashboard propose, l'utilisateur valide. Liste de départ = les paniers des tests 2024-2026, choisis après coup :
# À VALIDER par l'utilisateur (ajouter, retirer, renommer). Seules les actions retenues de la vue TradingView (filtres de
# config/industries.toml [universe]) comptent ; un thème de moins de [index] min_members actions retenues est affiché sans rang.
# name = libellé affiché · tickers = symboles (majuscules) · etf = ETF de confirmation (config/sectors.toml), facultatif

