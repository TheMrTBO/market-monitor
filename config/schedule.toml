# Horaires des passages (UTC, format cron). SOURCE UNIQUE : le dashboard (« prochaine mise à jour »), la doc et les tests
# lisent ce fichier. Deux déclencheurs :
#  - cron-job.org (principal, à l'heure exacte) : à recopier À LA MAIN dans cron-job.org si on change une expression ;
#  - créneaux `schedule` des workflows GitHub (secours, souvent en retard) : un test vérifie qu'ils correspondent à ce fichier.
# Expressions cron : minute heure jour-du-mois mois jour-de-semaine (0 ou 7 = dimanche, 1-6 = lundi-samedi).

[workflows.postmarket]
file = "postmarket.yml"
label = "Scan post-market"
cron_job_org = "7,22,37,52 0,1,20,21,22,23 * * 1-6"
github_fallback = ["7,22,37,52 20-23 * * 1-5", "7,22,37,52 0 * * 2-6", "7,22 1 * * 2-6"]

[workflows.update]
file = "update.yml"
label = "Mise à jour des données"
cron_job_org = "17 1,3,5-8,22 * * *"
github_fallback = ["17 22 * * *", "17 1 * * *", "17 3 * * *", "43 5 * * *"]

[workflows.short]
file = "short.yml"
label = "Short interest"
cron_job_org = "17 12 * * 1-6"     # 12:17 UTC du lundi au samedi : loin du matin (05-08 UTC) et du post-market (20-01 UTC)
github_fallback = ["17 12 * * 1-6"]

[workflows.intraday]
file = "intraday.yml"
label = "Relevés en séance"
# relevés de config/intraday.toml (10 h 00, 12 h 00 et 15 h 30 à New York) : 14:00 / 16:00 / 19:30 UTC en heure d'été,
# 15:00 / 17:00 / 20:30 UTC en heure d'hiver ; les autres créneaux (+30 min) servent de nouvel essai ou ne font rien (fetch_intraday.py sort sans requête ni commit).
# Minutes 0 et 30 : à l'écart du scan post-market (7, 22, 37, 52). Couverture contrôlée par mmconfig.py --check.
cron_job_org = "0,30 14-17,19,20 * * 1-5"
github_fallback = ["0,30 14-17,19,20 * * 1-5"]
