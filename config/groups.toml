# Groupes de l'onglet Secteurs (10/11/2026, décision de l'utilisateur) : remplacent les industries TradingView, trop larges
# (NXT, tracker solaire, était rangé en « Electronic Equipment/Instruments »). Chaque action retenue a été classée d'après sa
# description Finviz (relevé du 10/11/2026, relu action par action) : 32 groupes thématiques construits sur les descriptions,
# les autres reprennent l'industrie Finviz (noms anglais) ou la découpent (biotech par aire thérapeutique, etc.).
# [groups] = liste VALIDÉE (« groupe » = [tickers]) : un ticker dans un seul groupe ; seul l'utilisateur la modifie.
# Une action absente de [groups] reçoit un groupe PROVISOIRE (marqué « ≈ » sur la page) : 1. premier [[auto.rule]] dont un mot
# figure dans sa description Polygon (fetch_descriptions.py, cache hors dépôt) ; 2. sinon le groupe le plus fréquent parmi
# les actions validées de son industrie TradingView (au moins min_share_pct % d'entre elles) ; 3. sinon son industrie TradingView.
# Relecture complète : relevé Finviz à la demande (navigateur, hors robot : Finviz interdit les relevés automatisés).

[auto]
min_share_pct = 20         # règle 2 : groupe le plus fréquent parmi les actions validées de l'industrie TradingView, s'il en a au moins cette part
mark = "≈"                 # marque d'un groupe provisoire sur la page
tip = "Groupe provisoire : action pas encore classée à la main ; groupe déduit de sa description (Polygon) ou de son industrie TradingView."

[descriptions]             # fetch_descriptions.py : descriptions Polygon des actions non classées (même clé, même plan gratuit)
file = "cache/descriptions.json"   # hors dépôt (cache Actions de update.yml, avec l'historique)
max_per_run = 12           # descriptions lues par passage (plan gratuit : 5 appels par minute)
pause = 12.5               # secondes entre deux appels
refresh_days = 365         # description relue au-delà

# Règles du groupe provisoire (ordre = priorité) : group = groupe de [groups], words = expressions cherchées dans la description
# (sans casse, regex Python).

[[auto.rule]]
group = "Quantique"
words = 'quantum'

[[auto.rule]]
group = "Mineurs bitcoin"
words = 'bitcoin min|cryptocurrency min|digital asset min'

