# Affichage : seuils, couleurs, libellés. Lu par le dashboard via config_data.js (généré : python mmconfig.py --js).

[breadth]
# seuils des cases du MM (bas, haut) : couleur rouge sous le bas, bleue à partir du haut, grise entre les deux
ratio5 = [1, 1.5]
rq = [1, 1.5]
rm = [1, 2]
rm_log = true              # graphique Ratio mois en échelle logarithmique (décision du 29/10/2026 : seuil du lessivage 0,3 lisible)
rq_log = true              # graphique Ratio trimestre en log (29/10/2026 : pic de 20,8 en février 2021, mars-mai écrasés en linéaire)
ratio_zone_alpha = 0.5     # graphiques des ratios : opacité des zones bleue / rouge (1 = couleur des cases ; 29/10/2026 : allégées)
t2108_extremes = [20, 70]   # T2108 : zones extrêmes (orange)
record_sessions = 63        # « ▲ / ▼ 3M » du MM (cases, jauge 3M, barres, indices) : record = au-delà du plus haut / plus bas des N séances précédentes
compare_sessions = 60       # contrôle croisé calcul maison / TradingView ↔ Stockbee : dernières séances communes (corrélation, écart)
compare_min = 5             # en dessous de ce nombre de séances communes : pas de corrélation affichée
t2108_alert_sources = ["sb"]   # sources dont un T2108 extrême déclenche l'alerte (sb = Stockbee ; own = calcul maison ; tv = TradingView)
source_labels = { sb = "Stockbee", own = "maison", tv = "TradingView" }   # étiquette de source sur les cases du MM

[vix]
refs = [20, 30]            # lignes de repère du graphique VIX

[chart_nine]
# Bougies 9M sur tous les graphiques de prix (demande du 01/11/2026) : seuils du scan 9M (config/sources.toml [tv_breadth.breakouts]),
# couleur --c9m (cyan) du thème des graphiques ; ▲ sous la bougie : plein = bougie forte, creux = bougie faible
shown = true
label = "9M"
strong_label = "bougie forte"
tip = "Bougie 9M : même règle que le scan 9M de l'onglet Secteurs (hausse ≥ {pct} % sur la veille, volume > {vol} M et > celui de la veille, clôture > {price} $). ▲ plein : bougie forte (clôture dans le haut de la bougie, range ≥ ADR et > celui de la veille) ; ▲ creux : bougie faible."
legend = "Bougie cyan = 9M · ▲ plein = bougie forte, ▲ creux = bougie faible"
skip = ["BTC"]                # graphiques sans marque 9M (onglet QQQ · IWM · BTC) : volumes du bitcoin non comparables au scan

[colors]
# Base 100 de l'onglet SA (ni bleu ni rouge, réservés aux hausses / baisses), validées sur fond noir
base100 = { QQQ = "#199e70", IWM = "#d95926", BTC = "#9085e9" }

[sectors]
# filtres de l'onglet Secteurs : [clé (groupe de config/sectors.toml ou all), libellé]
groups = [["all", "Tous"], ["Secteur", "Secteurs"], ["Industrie", "Industries"], ["Thème", "Thèmes"], ["Matières", "Matières"], ["Pays / région", "Pays"]]
# bulle d'information de chaque filtre (la liste des ETF du groupe est ajoutée automatiquement)
group_tips = { all = "Tous les ETF suivis, tous groupes confondus.", "Secteur" = "Les 11 secteurs SPDR du S&P 500 (XLK, XLE…) : la vue la plus large du marché, pondérée par capitalisation.", "Industrie" = "ETF d'une industrie précise (semi-conducteurs, banques régionales, pétrole E&P…) : plus étroits qu'un secteur.", "Thème" = "ETF thématiques transversaux (cybersécurité, cloud, quantique, nucléaire…) : souvent plus volatils, parfois récents.", "Matières" = "Producteurs de matières premières et métal physique (or, argent, cuivre, terres rares, agriculture).", "Pays / région" = "Marchés hors États-Unis." }
# bascule en tête de l'onglet : [clé, libellé] ; etf = config/sectors.toml, tv = secteurs → industries → actions TradingView
views = [["etf", "ETF"], ["tv", "TradingView"]]

[sectors.kpis]
# cases en tête de la vue TradingView de l'onglet Secteurs (décision du 20/10/2026) ; un toucher = raccourci (filtre ou tri)
# ind : industries au TI65 > 1 · sec : secteurs au TI65 > 1 · rot : rotation (industries qui passent au-dessus / en dessous
# de 1 en `rotation_window` séances ; pas les rangs : un classement est à somme nulle, ▲ et ▼ s'y équilibrent toujours) ·
# stk : actions retenues au TI65 > 1 (série calculée par fetch_industries.py). Ordre d'affichage = ordre de la liste.
tiles = ["ind", "rot", "bo9", "t9"]   # audit du 31/10/2026 : 6 → 4 cases (avant : "sec", "ind", "rot", "rr", "stk", "th") ;
tiles_text = { bo9 = "9M à regarder", bo9_none = "pas de repères pour cette séance", bo9_ext = ["étendu", "étendus"], bo9_kw = "bougie forte", bo9_own = "actions retenues, calcul maison", t9 = "Thèmes 9M", t9_none = "pas de liste 9M", t9_loading = "chargement…", t9_sub = "dont {n} {r}", t9_kw = "{k} titres et {p} % en {w} s" }   # cases 9M (01/11/2026)
# secteurs, actions TI65 > 1 : même mesure que les industries ; ratio de rotation : mêmes entrées / sorties que « rot » ; thèmes
# chauds : « chaud » seul sans avance mesurée. bo9 : 9M à regarder (bougie forte pas étendue) ; t9 : Thèmes 9M (sectors.actifs nine_*)
# th (thèmes chauds de config/themes.toml, 27/10/2026), sec, rr, stk : toujours disponibles en les remettant dans la liste
rotation_window = 5           # « Rotation » : entrées / sorties au-dessus de 1 comptées sur ce nombre de séances
# rr : ratio de rotation = entrées ÷ sorties de chaque séance, cumulées sur rotation_ratio_sessions séances, lu comme « Ratio 5 j »
# du MM ; dessous : les deux totaux (entrées / sorties). Plus de fenêtre 10 j (demande du 20/10/2026 : ratio 10 j non utilisé).
rotation_ratio_sessions = 5
rotation_ratio = [1, 1.5]     # couleur : rouge sous 1 (plus de sorties que d'entrées), bleue à partir de 1,5, grise entre
record_sessions = 252         # cases de l'onglet Secteurs : jauge et « plus haut / plus bas » sur cette fenêtre (01/11/2026 : 12 mois)
record_label = "12M"           # étiquette de la jauge
record_text = "12 mois"         # « ▲ Plus haut 12 mois »
breadth_mid = 50              # cases « … TI65 > 1 » : bleu à partir de ce pourcentage, rouge en dessous ; pointillé des mini-courbes
benchmark = "IWM"             # repère mesuré du ratio de rotation (bulle ⓘ) : variation de cet instrument (prices_data.js) après chaque séance

[sectors.map]
# Carte des thèmes (31/10/2026, à la place de la carte de rotation retirée : zones sans avance, tests 13-14) : chaque industrie
# placée par sa tendance (x = rang TI65 parmi les industries, 0-100) et sa demande actuelle (y = part de ses actions retenues en
# 9M sur [sectors.actifs] nine_window séances) ; taille = leaders ; couleur = état (neuf, chaud, 9M fort). Zones mesurées hors
# dépôt sur 2008-2025 (règles du site rejouées, yfinance) : indice de l'industrie sur 21 séances moins la moyenne des
# industries, à élan 10 j et tendance 63 j égaux. 9M fort = [sectors.actifs] nine_min titres et nine_share %.
shown = true
label = "Carte des thèmes"
x_hot = 80                    # trait vertical : rang TI65 à partir duquel une industrie peut être « chaude » (top 20 %)
y_max = 100                   # haut de l'axe des 9M (en %) : toutes les parts possibles
trail = 5                     # traînée : séances montrées (la séance affichée comprise), sur les points 9M fort ou neufs et sur le point choisi
y_scale = "log"               # axe des 9M : "log" (log(1 + part / y_log_k) : log au-delà de quelques %, garde 0 %), "sqrt" ou "linear"
y_log_k = 5                   # log : part (en %) où l'échelle passe de quasi linéaire à logarithmique
y_ticks = [0, 5, 10, 20, 35, 50, 100]   # graduations de l'axe des 9M (en %)
x_title = "Tendance : rang TI65 parmi les industries"
y_title = "% des actions en 9M (10 s)"
read_hint = "Ce n'est pas un graphique dans le temps : → la tendance de l'industrie se renforce face aux autres, ← elle faiblit · ↑ plus de ses actions en breakout 9M, ↓ moins. La flèche montre d'où vient le point sur les dernières séances."
time_sessions = 252           # tableau par zone : séances des courbes de la part en 9M (≈ 12 mois, demande du 01/11/2026)
time_label = "12 mois"          # durée des courbes en clair (légende du tableau)
side_share = 58               # côte à côte : part de la largeur pour la carte (%, flex-grow)
map_min = 540                 # largeur minimale de la carte (px, flex-basis) ; carte + tableau plus larges que le bloc : l'un sous l'autre
zone_min = 380                # largeur minimale du tableau par zone (px)
grow_max = 420                # côte à côte : hauteur ajoutée au plus à la carte (px) pour finir à la hauteur du tableau
zones = { reveil = "Réveil", lasting = "Thème qui dure", trend = "Tendance seule", calm = "Calme" }
zone_notes = { reveil = "+1,8 % sur 21 s · 11 ans / 18 (13 / 18 à 42 s)", lasting = "+0,7 % sur 21 s · 9 ans / 18, instable", trend = "−0,02 %", calm = "−0,03 %" }
# notes vérifiées le 01/11/2026 avec les définitions du site (actions retenues ≥ 3 $, volume moyen ≥ 100 000 ; règle « chaud » du site) :
# cache/analyse_scans/verif_site.txt. Avec toutes les actions liquides (tests d'origine), Réveil faisait +1,6 %, 14 années sur 18.
tip = "Chaque point est une industrie (actions retenues de l'onglet). À droite : tendance forte (rang TI65 face aux autres industries) ; en haut : beaucoup de ses actions en breakout 9M ces 10 dernières séances. Tests 2008-2025 avec les définitions du site : la zone Réveil (9M fort sans être chaude) a fait le mieux, +1,8 % sur 21 séances contre les autres industries, mais seulement 11 années sur 18 (13 sur 18 à 42 séances) ; « chaud » sans 9M n'a rien apporté. À côté, le tableau reprend les industries qui comptent, avec leurs actions en 9M."

[sectors.map.board]
# Tableau par zone (01/11/2026), à côté de la carte : une ligne par industrie Réveil, thème qui dure ou neuve (pastilles = membres,
# remplies si en 9M ; courbe de la part en 9M ; titres en 9M, ▲ = bougie forte), puis les autres industries à 9M ≥ 2 titres.
label = "Convergence des 9M"   # titre du composant, à côté de la carte (« Thèmes par zone » jusqu'au 02/11/2026)
copy_tip = "Copier tous les titres en 9M du tableau (tickers séparés par des virgules)"
copy_zone_tip = "Copier les titres en 9M de la zone {z}"
neuf_label = "Neuf"
notes = { neuf = "avec 9M +1,0 % sur 21 s, sans +0,3 %", other = "≥ 2 titres, +0,5 % sur 21 s · 16 ans / 18" }   # verif_site.txt (01/11/2026)
other_label = "9M actif ailleurs"
other_max = 8                 # industries montrées avant « + N autres »
dots_max = 30                 # pastilles (une par membre) jusqu'à ce nombre de membres ; au-delà, le compte seul
basket = "panier {k}"         # ≥ 2 de ses titres 9M dans un panier de config/themes.toml
same_day = "⚠ les {n} le même jour"
lift_label = "{x}× le marché"       # concentration : part des membres en 9M ÷ part de toutes les actions retenues en 9M (01/11/2026)
lift_short = "{x}×"
lift_hi = 2                   # à partir de ce multiple, la concentration est mise en avant (≥ 3 titres et ≥ 2× ≈ règle des 20 %, verif_sousgroupes)
lift_tip = "Concentration : {p} % des membres en 9M contre {b} % de toutes les actions retenues. Un gros groupe actif l'est souvent par sa taille (Packaged Software) ; une forte concentration signale une demande propre au groupe. Tests 2008-2025 (verif_sousgroupes) : ≥ 3 titres et ≥ 2× le marché ≈ la règle des 20 % (+0,8 % sur 21 s, 14 ans / 18) ; une information, pas une nouvelle règle."
age_label = "grappe depuis {n} s"   # séances consécutives avec au moins [sectors.actifs] nine_min titres en 9M sur nine_window séances
age_buckets = [5, 20, 60]     # bornes des tranches d'âge (séances) des notes ci-dessous
age_notes = ["1-5 s : +0,45 % sur 21 s · 11 ans / 18", "6-20 s : +0,84 % · 12 / 18", "21-60 s : +0,97 % · 8 / 14", "plus de 60 s : +0,74 % · 3 / 8"]
age_tip = "Âge de la grappe : séances consécutives avec au moins {k} titres en 9M sur {w} séances. Tests 2008-2025 (actions retenues du site, verif_age.txt), indice de l'industrie sur 21 séances contre les autres à élan égal : {notes}. L'avance moyenne grandit après 5 séances, pas la régularité : une information, pas une règle."
low_rank = 40                 # zone Réveil : rang TI65 sous ce seuil = industrie délaissée, en tête de la zone avec l'étiquette (01/11/2026)
low_label = "délaissée"
low_tip = "Industrie délaissée (rang TI65 sous {r}) dont plusieurs titres sortent en 9M : le meilleur cas de la zone Réveil. Tests 2008-2025 (actions retenues du site, verif_reveil_rang.txt), indice de l'industrie sur 21 séances contre les autres à élan égal : rang sous 40 +2,8 % (12 ans / 18, médiane +2,4 %, +5,0 % à 42 s) ; rang 60 et plus +0,7 % (10 ans / 18). Même résultat à volatilité égale ; le sens du rang (monte ou baisse) n'apporte rien. La zone reste irrégulière : une information pour l'ordre de lecture, pas une règle."
same_day_tip = "Tous ses titres 9M sont partis la même séance : souvent une nouvelle commune (rachat, résultats, réglementation) plutôt qu'un thème qui s'installe. Non testé à part."
legend = "● = un membre, rempli s'il est en 9M sur {w} séances · courbe = part en 9M sur {d}, pointillé {s} % · ▲ bougie forte"   # détail d'une ligne de la grille
empty = "Aucune industrie en zone Réveil, thème qui dure ou neuve, ni avec 2 titres en 9M, à cette séance."
# Grille de convergence des 9M (02/11/2026, demande de l'utilisateur : « le site fait l'historique et la convergence des 9M que je
# fais de tête chaque matin sur TC2000 »). Tests hors dépôt 2008-2025 et 2026 (cache/analyse_scans/verif_grille_alerte.txt,
# verif_grille_dynamique.txt, verif_2026_hors_echantillon.txt) : groupes affichés +1,4 % sur 21 s (13 ans / 18) ; convergence =
# dérive sur 21-42 séances, pas un déclencheur à 5 j ; 73 % des séances sans changement de la liste.
grid_sessions = 20            # cases par ligne : titres du groupe en 9M à chaque séance (historique nine de industries_data.js)
grid_legend = "case = titres du groupe en 9M ce jour-là ({n} séances ; point vert = EP probable) · barre = rang TI65, zone verte sous {low} = délaissée · ▲ bougie forte · toucher une ligne : détail et point sur la carte"
howto = "Où les 9M s'accumulent : leurs titres en 9M = ta liste à surveiller (dérive sur 21-42 séances, pas un signal d'entrée). Ordre selon la phase, puis nombre de 9M."
rows_max = 8                  # groupes affichés avant « + N autres groupes » (limite de la maquette : coupe 4 % des séances, 2008-2025)
row_tickers = 5               # titres en 9M montrés sur la ligne (tous dans le détail)
in9 = "en 9M"
more_rows = "+ {n} autres groupes"
less_rows = "Afficher moins"
copy_zone = "Copier {z}"
view_grid = "Grille"          # bascule du bloc (02/11/2026) : la carte des thèmes est une vue du bloc, plus un bloc à côté
view_map = "Carte"
# bulle ⓘ du bloc (02/11/2026, demande de l'utilisateur : « comment fonctionne la convergence 9M ») : un paragraphe par entrée,
# « Titre : texte » ; {k} = nine_min, {w} = nine_window, {s} = nine_share, {low} = low_rank, {n} = grid_sessions, {m} = moves_sessions,
# {r} = rows_max, {g} = gone_sessions, {p} = rank_up_pts, {q} = rank_up_sessions
help = [
  "À quoi sert ce bloc : chaque matin tu passes les 9M en revue sur TC2000. Ce bloc garde leur historique et les range par groupe (industrie TradingView ou thème de ta liste suivie) pour montrer où ils s'accumulent : ce que la tête ne peut pas retenir d'un jour à l'autre.",
  "Quand un groupe apparaît : au moins {k} de ses titres en 9M sur les {w} dernières séances, et au moins {s} % de ses membres (« 9M fort »). Il sort quand ce n'est plus vrai.",
  "Les zones : Réveil = 9M fort sans que le groupe soit chaud (la demande arrive avant la tendance) ; Réveil délaissée = la même chose avec un rang TI65 sous {low} ; Thème qui dure = 9M fort dans un groupe déjà chaud ; Neuf = grappe de leaders apparue récemment.",
  "L'ordre, en 4 clés : 1) la zone, dans l'ordre de la phase de la séance (Expansion A, B, C ou chaude : Thème qui dure, Réveil, Neuf ; Contraction, Lessivage, Reprise, Surchauffe, Choc : Réveil, Thème qui dure, Neuf) ; 2) dans la zone Réveil, les délaissées (rang TI65 sous {low}) d'abord, sauf en Expansion A, B ou C où l'étiquette n'a pas tenu ; 3) le nombre de titres distincts en 9M sur {w} séances ; 4) à égalité, la part du groupe en 9M. Au plus {r} groupes, puis « + N autres groupes » ; les groupes sortis viennent en dernier, grisés, du plus récent au plus ancien. Le nombre classe mieux que la part (tests 2008-2025 : 3 premières lignes +1,6 % sur 21 s contre +1,4 %), mais l'écart entre lignes reste faible : c'est un ordre de lecture, pas un classement d'achat.",
  "Lire une ligne : la barre = rang TI65 du groupe parmi les industries (0 le plus faible, 100 le plus fort ; zone verte sous {low} = délaissé) ; ↑ = rang d'au moins {low} qui gagne plus de {p} points en {q} séances ; « n / m en 9M » = titres en 9M sur {w} séances / membres ; les titres ▲ ont une bougie forte.",
  "Les cases : une par séance sur {n} séances, avec le nombre de titres du groupe en 9M ce jour-là (plus la case est foncée, plus il y en a) ; un point vert = EP probable d'un titre du groupe. Une case qui se remplit séance après séance = convergence qui s'installe ; un seul jour plein = souvent une nouvelle commune.",
  "Entrées et sorties : « Sur {m} séances » liste les groupes entrés et sortis. Un groupe sorti reste grisé {g} séances : près d'un sur deux revient sous 20 séances.",
  "Ce que ça vaut : tests 2008-2025 (indice du groupe sur 21 séances face aux autres industries, à élan égal) : groupes affichés +1,4 % (13 années sur 18) ; Réveil délaissée +2,8 % ; Thème qui dure +0,7 %, instable. C'est une dérive sur 1 à 2 mois, pas un signal d'entrée : l'entrée reste la bougie forte + 9M du titre (bloc Breakouts 9M).",
  "Toucher une ligne : son détail s'ouvre juste dessous (âge de la grappe, concentration, panier, thèmes ETF, courbe 12 mois, tous les titres). Carte : les mêmes groupes en 2D."
]
