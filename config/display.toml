[ticker_popup]
# Fenêtre graphique d'un ticker (01/11/2026) : titres du tableau par zone et du bloc 9M
range = "1A"                  # préréglage à l'ouverture (3M, 6M, YTD, 1A, 2A, 5A, Tout)
loading = "chargement…"
no_index = "index des tickers indisponible"
not_found = "pas dans l'index des tickers"
no_chart = "pas de graphique pour ce titre"
fiche = "Fiche ›"
