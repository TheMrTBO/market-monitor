gone_label = "sorti il y a {n} s"
theme_tag = "thème"
theme_tip = "Thème suivi (config/themes.toml) : panier suivi comme une industrie, rang TI65 de son indice placé parmi les industries. Pas d'étiquette « délaissée » : l'avance a été mesurée sur les industries ; un panier très volatil touche vite le bas du classement après une baisse (non testé)."

# Ordre des zones du tableau selon la phase de marché de la séance (01/11/2026). Tests hors dépôt, phases du site 2019-2025
# (7 ans seulement ; cache/analyse_scans/verif_zones_phases.txt) : en Expansion, « Thème qui dure » fait le mieux et la Réveil
# délaissée ne tient pas en Expansion A-B-C ; ailleurs (Choc, Lessivage, Reprise, Surchauffe, Contraction), la Réveil délaissée
# fait le mieux et « Thème qui dure » ≈ 0 ou négatif. Chaque phase de [[phases.phase]] doit figurer dans une seule règle.
# order = zones dans l'ordre (rev = Réveil, both = Thème qui dure, neuf) ; low = délaissées en tête de Réveil avec l'étiquette.
# Phase inconnue (séance pas encore calculée) : default_order et étiquette « délaissée ».
default_order = ["rev", "both", "neuf"]
phase_label = "Phase {p} : {z} d'abord"   # ligne en tête du tableau ({p} = phase, {z} = première zone)
[[sectors.map.board.phase_rule]]
phases = ["exp_a", "exp_b", "exp_c"]
order = ["both", "rev", "neuf"]
low = false
tip = "En Expansion A, B ou C (tests 2019-2025, écart de l'industrie sur 21 séances à élan égal) : Thème qui dure +4,1 % (6 ans / 7) ; Réveil au rang TI65 40 ou plus +4,0 % (4 / 7) ; Réveil délaissée +0,4 % seulement (3 / 7), donc sans étiquette. Bougie forte + 9M la plus forte dans ces phases : un titre sur trois à +25 % en 21 séances."
[[sectors.map.board.phase_rule]]
phases = ["hot"]
order = ["both", "rev", "neuf"]
low = true
tip = "En Expansion chaude (tests 2019-2025, écart de l'industrie sur 21 séances à élan égal) : Thème qui dure +4,6 % (5 ans / 7) ; puis Réveil délaissée +3,6 % (4 / 7)."
[[sectors.map.board.phase_rule]]
