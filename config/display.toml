# Affichage : seuils, couleurs, libellés. Lu par le dashboard via config_data.js (généré : python mmconfig.py --js).

[breadth]
# seuils des cases du MM (bas, haut) : couleur rouge sous le bas, bleue à partir du haut, grise entre les deux
ratio5 = [1, 1.5]
rq = [1, 1.5]
rm = [1, 2]
t2108_extremes = [20, 70]   # T2108 : zones extrêmes (orange)
record_sessions = 63        # « ▲ / ▼ 3M » du MM (cases, jauge 3M, barres, indices) : record = au-delà du plus haut / plus bas des N séances précédentes
compare_sessions = 60       # contrôle croisé calcul maison / TradingView ↔ Stockbee : dernières séances communes (corrélation, écart)
compare_min = 5             # en dessous de ce nombre de séances communes : pas de corrélation affichée
t2108_alert_sources = ["sb"]   # sources dont un T2108 extrême déclenche l'alerte (sb = Stockbee ; own = calcul maison ; tv = TradingView)
source_labels = { sb = "Stockbee", own = "maison", tv = "TradingView" }   # étiquette de source sur les cases du MM

[vix]
refs = [20, 30]            # lignes de repère du graphique VIX

[colors]
# Base 100 de l'onglet SA (ni bleu ni rouge, réservés aux hausses / baisses), validées sur fond noir
base100 = { QQQ = "#199e70", IWM = "#d95926", BTC = "#9085e9" }

[sectors]
# filtres de l'onglet Secteurs : [clé (groupe de config/sectors.toml ou all), libellé]
groups = [["all", "Tous"], ["Secteur", "Secteurs"], ["Industrie", "Industries"], ["Thème", "Thèmes"], ["Matières", "Matières"], ["Pays / région", "Pays"]]
# bulle d'information de chaque filtre (la liste des ETF du groupe est ajoutée automatiquement)
group_tips = { all = "Tous les ETF suivis, tous groupes confondus.", "Secteur" = "Les 11 secteurs SPDR du S&P 500 (XLK, XLE…) : la vue la plus large du marché, pondérée par capitalisation.", "Industrie" = "ETF d'une industrie précise (semi-conducteurs, banques régionales, pétrole E&P…) : plus étroits qu'un secteur.", "Thème" = "ETF thématiques transversaux (cybersécurité, cloud, quantique, nucléaire…) : souvent plus volatils, parfois récents.", "Matières" = "Producteurs de matières premières et métal physique (or, argent, cuivre, terres rares, agriculture).", "Pays / région" = "Marchés hors États-Unis." }
# bascule en tête de l'onglet : [clé, libellé] ; etf = config/sectors.toml, tv = secteurs → industries → actions TradingView
views = [["etf", "ETF"], ["tv", "TradingView"]]

[sectors.kpis]
# cases en tête de la vue TradingView de l'onglet Secteurs (décision du 20/10/2026) ; un toucher = raccourci (filtre ou tri)
# ind : industries au TI65 > 1 · sec : secteurs au TI65 > 1 · rot : rotation (industries qui passent au-dessus / en dessous
# de 1 en `rotation_window` séances ; pas les rangs : un classement est à somme nulle, ▲ et ▼ s'y équilibrent toujours) ·
# stk : actions retenues au TI65 > 1 (série calculée par fetch_industries.py). Ordre d'affichage = ordre de la liste.
tiles = ["sec", "ind", "rot", "rr", "stk", "th"]   # secteurs d'abord, puis industries (demande du 20/10/2026) ;
# th : thèmes chauds (config/themes.toml), ajoutée le 27/10/2026 (refonte de l'onglet, mêmes visuels que les autres cases)
rotation_window = 5           # « Rotation » : entrées / sorties au-dessus de 1 comptées sur ce nombre de séances
# rr : ratio de rotation = entrées ÷ sorties de chaque séance, cumulées sur rotation_ratio_sessions séances, lu comme « Ratio 5 j »
# du MM ; dessous : les deux totaux (entrées / sorties). Plus de fenêtre 10 j (demande du 20/10/2026 : ratio 10 j non utilisé).
rotation_ratio_sessions = 5
rotation_ratio = [1, 1.5]     # couleur : rouge sous 1 (plus de sorties que d'entrées), bleue à partir de 1,5, grise entre
record_sessions = 63          # « plus haut / plus bas 3 mois » et jauge 3M : fenêtre en séances (comme le MM)
breadth_mid = 50              # cases « … TI65 > 1 » : bleu à partir de ce pourcentage, rouge en dessous ; pointillé des mini-courbes
benchmark = "IWM"             # repère mesuré du ratio de rotation (bulle ⓘ) : variation de cet instrument (prices_data.js) après chaque séance

[sectors.rrg]
# carte de rotation (type RRG, Julius de Kempenaer) de la vue TradingView, relative au marché = toutes les actions retenues :
# x = TI65 de la force relative (indice ÷ marché) × 100 (> 100 : surperforme) ; y = 100 × x / x d'il y a `momentum` séances
# (> 100 : la surperformance accélère). Quatre zones : Meneur, S'affaiblit, En retard, S'améliore. Taille du point = volume en
# dollars relatif au marché (config/industries.toml [volume]).
trail = 10                    # séances de la traînée (direction du mouvement)
momentum = 5                  # séances de la variation de x
labels = { lead = "Meneur", weak = "S'affaiblit", lag = "En retard", impr = "S'améliore" }
# tableau « Depuis la veille » au-dessus de la carte (demandes du 21/10/2026 : repérer vite les changements majeurs, confirmer un
# secteur chaud, donner des pistes sur le prochain ; remplace la liste « plus gros mouvements »). Vues : Confirmés (Meneur qui monte
# aussi seul, largeur suffisante), Pistes (force relative pas encore étendue, en hausse, accélération qui monte, qui s'élargit ;
# puis « en surveillance » : En retard dont la baisse ralentit), Changements (mouvements forts puis bascules), Tous (lien sous le
# tableau). Mesuré au 19/10/2026 : marché faible (23 % des industries au TI65 > 1), les meneurs relatifs y sont souvent défensifs
# (Conso. courante TI65 0,989, Services aux collectivités 0 industrie sur 4 au-dessus de 1) : d'où le TI65 seul et la largeur.
delta_windows = [1, 5]        # colonnes Δ de la force relative (séances) : courte = changements, longue = tendance (Δ, accélération,
                              # largeur des actions d'une industrie) ; entrées / sorties des industries d'un secteur : [sectors.kpis] rotation_window
major_factor = 2.0            # mouvement « fort » : déplacement sur la carte ≥ ce facteur × le déplacement médian de la séance
zone_margin = 0.5             # bascule de zone « limite » quand le point est à moins de cette distance de l'axe franchi
table_rows = 6                # lignes affichées avant « Voir les N autres »
confirm_ti65 = 1.0            # Confirmés : TI65 du secteur seul (sans le comparer au marché) au-dessus de ce seuil
confirm_breadth = 0.5         # Confirmés : part minimale des membres au TI65 > 1 (industries d'un secteur, actions d'une industrie)
pistes_max_rs = 101.0         # Pistes : force relative au plus à ce niveau (pas encore étendue ; 100 = comme le marché)
views = { conf = "Confirmés", pist = "Pistes", chg = "Changements", all = "Tous" }   # libellés des vues du tableau
tags = { strong = "fort", edge = "limite", fade = "s'essouffle", watch = "surveillance" }   # étiquettes des lignes
measure_sessions = [5, 10]    # repère mesuré des bulles Confirmés / Pistes : force relative ces nombres de séances plus tard
measure_streak = 3            # repère : Pistes présentes depuis au moins ce nombre de séances, mesurées à part
streak_max = 20               # colonne « Depuis » : séances consécutives comptées au plus (affiché « 20+ j »)
default_view = "pist"         # vue du tableau à la première visite (mesure du 21/10/2026 : Confirmés arrive tard)
default_view_in = "all"       # vue dans un secteur ou une industrie (peu de membres : Pistes y filtre presque tout)
# refonte du 27/10/2026 : la carte et son tableau ne prédisent rien sur 2019-2026 (tests 13 et 14 du document d'analyse) ;
# gardés comme description, repliés par défaut (un toucher sur le titre les ouvre ; choix mémorisé)
folded = true
shown = false                 # retirée de la page le 27/10/2026 (aucune avance mesurée, tests 13-14 ; choix de l'utilisateur) : true = la remettre en fin d'onglet

[sectors.actifs]
# Bloc « Groupes actifs » et niveau « Leaders actifs » de la vue TradingView (refonte du 27/10/2026, exception au gel accordée le
# 27/10/2026 à la demande de l'utilisateur). Leaders et signaux calculés par fetch_industries.py (config/industries.toml [leaders]).
# Chaud = règle de l'onglet Tickers ([tickers] : top hot_top_pct % des industries, TI65 > 1, largeur ≥ hot_min_breadth %) ; un thème
# est comparé au seuil des industries (le top 20 % se calcule sur les industries seules : test 10).
fresh_sessions = 42           # neuf = signal (grappe d'industrie ou panier de thème) sans signal ni état chaud dans les 42 séances d'avant…
neuf_window = 10              # …et parti depuis au plus ce nombre de séances
old_sessions = 42             # « s'essouffle » (information, pas une règle de sortie : test 9) : chaud depuis au moins ce nombre de séances
list_limit = 30               # Leaders actifs : lignes affichées avant « + N autres » (tri par gain sur 21 séances : test 11)
high_sessions = 20            # colonne « / plus haut » : écart au plus haut de ce nombre de séances (0 = au plus haut : encore en base ou déjà parti)
alert_phases = ["wash", "shock"]   # alerte « phase avec groupes chauds » : clés de [[phases.phase]] (test 9 : seul signal net)
pioneer_gain_pct = 50         # pionnier : leader à +50 % ou plus sur 21 séances, devenu leader depuis au plus pioneer_window séances
pioneer_window = 10           # (et pas leader dans les fresh_sessions d'avant), son industrie ni chaude ni en grappe (test 8)
chauds_shown = 6              # groupes chauds affichés (ceux qui ont le plus de leaders) avant « + N autres » (retour UX du 27/10/2026)
trend_sessions = 5            # ligne « Sur N s » : groupes chauds, neufs et leaders comparés à N séances avant (voir à temps qu'il faut lever le pied)
label = "Groupes actifs"
leaders_label = "Leaders actifs"
alert_text = "Repère 2019-2026 : le premier jour de lessivage ou de choc, les thèmes chauds n'ont battu le marché que 28 à 41 % du temps sur les 42 séances suivantes."
neuf_tip = "Grappe de leaders (au moins 3 actions à +25 % sur 21 séances, 2 fois plus que le marché) ou moitié d'un panier de thème leader, sans signal dans les 42 séances d'avant. Signal le plus solide des tests (53 % devant le marché à 42 séances sur 2019-2026) : il dit où et quand, pas si le thème va marcher."
pioneer_tip = "Action seule à +50 % sur 21 séances, partie depuis au plus 10 séances, dans une industrie ni chaude ni en grappe : amorce de thème à valider (environ 2 par mois ; en moyenne, pas d'avance mesurée, seulement plus de très gros mouvements : test 8)."
# familles refuges (étiquette sur les groupes et les tickers) : pas de liste fixe qui tienne d'une contraction à l'autre (test 12)
refuges = { "Énergie" = ["Integrated Oil", "Oil & Gas Production", "Oil Refining/Marketing", "Oilfield Services/Equipment", "Contract Drilling", "Oil & Gas Pipelines", "Coal", "Marine Shipping"], "Métaux" = ["Precious Metals", "Other Metals/Minerals", "Steel", "Aluminum"], "Services publics" = ["Electric Utilities", "Gas Distributors", "Water Utilities", "Alternative Power Generation"], "Conso. de base" = ["Food: Major Diversified", "Food: Specialty/Candy", "Food: Meat/Fish/Dairy", "Beverages: Non-Alcoholic", "Beverages: Alcoholic", "Household/Personal Care", "Tobacco", "Food Retail", "Discount Stores", "Food Distributors"], "Santé défensive" = ["Pharmaceuticals: Major", "Managed Health Care", "Medical Distributors", "Hospital/Nursing Management"], "Assurance" = ["Property/Casualty Insurance", "Multi-Line Insurance", "Life/Health Insurance", "Specialty Insurance", "Insurance Brokers/Services"], "Défense" = ["Aerospace & Defense"] }

[adr]
# ADR (average daily range) des actions, sur toutes les listes de tickers (Secteurs, Tickers, Post-market, fiche) — décision du
# 20/10/2026 : 100 × (moyenne des `sessions` dernières séances de plus haut ÷ plus bas − 1). Lu aussi par fetch_industries.py
# (colonne adr de tickers_data.js). Filtre « ADR > x % » au niveau actions de Secteurs (0 = pas de filtre).
sessions = 20
step = 0.5                    # pas du champ du filtre

[ti65]
# indicateur de classement de l'onglet Secteurs (formule TC2000 de l'utilisateur, ne pas modifier sans accord) :
# moyenne des `short` dernières clôtures ÷ moyenne des `long` dernières ; lu aussi par fetch_industries.py (% de titres > 1)
name = "TI65"
short = 7
long = 65
spark = 63                 # séances de la miniature du TI65 dans les tableaux de l'onglet Secteurs (63 ≈ 3 mois)
spark_label = "3 mois"     # en-tête de la colonne de la miniature
delta = 5                  # colonne Δ : variation du rang sur `delta` séances
breadth_ref = 50           # carte « % des actions avec un TI65 > 1 » : ligne de repère (en %)

[tickers]
# onglet Tickers : un ticker ou une liste → secteur, industrie, TI65, capitalisation, flottant, short interest, thèmes chauds.
# Industrie « chaude » : rang TI65 dans le top hot_top_pct % des industries classées, TI65 > 1 et au moins hot_min_breadth %
# de ses actions au TI65 > 1 (mouvement fort et large). « Émergente » : TI65 > 1 et gain d'au moins emerging_min_delta places
# sur ti65.delta séances, sans être encore chaude.
hot_top_pct = 20
hot_min_breadth = 50
emerging_min_delta = 5
max_tickers = 300          # tickers analysés au plus par liste
example = "NVDA, MU, AMD, PENG, MXL, SMCI, RKLB, OKLO, IONQ, PLTR"   # texte d'exemple du champ de saisie
dvol_step = 10            # filtre « Vol $ > x M$ » (liste venue du scan 9M +4 %, exception au gel du 27/10/2026) : pas du champ, en M$

[phases]
# Phases de marché, bandeau en tête de l'onglet MM et frise sous le graphique des prix (spec du 26/10/2026 ; exception au gel
# de la refonte accordée le 26/10/2026). Calcul sur les chiffres Stockbee seulement (seuils réglés sur l'univers Worden), une
# phase par séance publiée ; elle vaut pour la séance suivante. Setups recommandés, en positif : ni interdit, ni nombre de trades,
# ni taille de position (préférences de l'utilisateur).
# Priorité : choc > surchauffe > expansion chaude > expansion A / B / C > reprise > lessivage > contraction.
choc_pct = 0.15            # choc : au moins 15 % de l'univers à −4 % sur une séance…
choc_sessions = 5          # …parmi les 5 dernières (séance du jour comprise)
mq_lag = 20                # mq = actions à +25 % sur un trimestre ÷ le même chiffre 20 séances plus tôt
mq_lag_valid = [15, 20]    # réglage FRAGILE (choisi sur le journal de trades, hors dépôt ; note du 26/10/2026) : valable
                           # entre 15 et 20 séances seulement ; mq_lag doit rester dans cette zone (--check).
                           # Suivi vers le 26/04/2027 sur les seuls trades nouveaux (hors dépôt).
confirm = 3                # état de fond : expansion après 3 clôtures de suite avec mq > 1, contraction après 3 avec mq ≤ 1
ext_on_r5 = 1.8            # marché étendu : ratio 5 j > 1,8 ou T2108 > 65 %…
ext_on_t2108 = 65
ext_off_r5 = 1.5           # …jusqu'à ratio 5 j < 1,5 et T2108 < 60 %
ext_off_t2108 = 60
hot_r5 = 2.7               # surchauffe : étendu avec ratio 5 j > 2,7 ou T2108 > 65 % (sans hystérésis, décision du 26/10/2026)
hot_t2108 = 65
grade_a_rm = 2.0           # expansion A : ratio mois (+25 % ÷ −25 % sur un mois) ≥ 2 ; B : ≥ 1 ; C : en dessous
grade_b_rm = 1.0
wash_rm = 0.3              # lessivage : ratio mois < 0,3 (en contraction)
rep_r5 = 2.0               # reprise : ratio 5 j ≥ 2… (au lieu du ratio 10 j de Stockbee, jamais testé : note du 26/10/2026)
rep_window = 15            # …dans les 15 séances après un lessivage
# signaux complémentaires (pastilles du bandeau)
pre_r5 = 1.5               # pré-expansion : ratio 5 j qui passe au-dessus (veille ≤), dans une phase de pre_phases
pre_phases = ["contraction", "wash", "recovery", "shock"]
pullback_r5 = [1.25, 1.5]  # repli d'entrée : ratio 5 j dans la zone et plus bas que pullback_lag séances avant, dans pullback_phases
pullback_lag = 5
pullback_phases = ["exp_a", "exp_b", "exp_c"]
record_sessions = 63       # records 3 mois : au-delà du plus haut / plus bas des 63 séances précédentes
alert_gap = 10             # une alerte = premier jour d'une série : pas de nouvelle alerte dans les 10 séances suivantes
setups_label = "Setups recommandés (EP = Episodic Pivot)"   # en-tête de la colonne des setups du bandeau

# une entrée par phase, dans l'ordre du cycle (légende de la frise) ; key = identifiant du calcul (ne pas changer).
# setups = l'essentiel, court (EP et / ou breakouts) ; detail = la précision, en plus petit dessous (vide si rien à ajouter).
# Toujours en positif (jamais d'interdit, ni nombre de trades ni taille de position) ; sigles en clair dans detail
# (SMA 10 = moyenne mobile simple 10 jours, 1R…) ; EP = Episodic Pivot est écrit dans l'en-tête du bandeau (setups_label).
[[phases.phase]]
key = "contraction"
name = "Contraction"
color = "#98a2b3"
setups = "EP"
detail = ""
rule = "état de fond en contraction : momentum trimestre (mq) à 1 ou moins sur {confirm} clôtures de suite"

[[phases.phase]]
key = "wash"
name = "Lessivage"
color = "#d99a2b"
setups = "EP"
detail = "noter les titres qui tiennent"
rule = "en contraction, ratio mois (actions à +25 % ÷ actions à −25 % sur un mois) sous {wash_rm}"

[[phases.phase]]
key = "recovery"
name = "Reprise"
color = "#3fbf74"
setups = "EP"
detail = "préparer la liste des leaders"
rule = "en contraction, ratio 5 jours (hausses ÷ baisses de 4 % sur 5 séances) à {rep_r5} ou plus dans les {rep_window} séances après un lessivage ; dure jusqu'à l'expansion ou un choc"

[[phases.phase]]
key = "exp_c"
name = "Expansion C"
color = "#9cc3f0"
setups = "Breakouts + EP"
detail = "breakouts de leaders · EP Proba 3"
rule = "état de fond en expansion (momentum trimestre au-dessus de 1 sur {confirm} clôtures de suite), marché non étendu, ratio mois sous {grade_b_rm}"

[[phases.phase]]
key = "exp_b"
name = "Expansion B"
color = "#5b9be6"
setups = "Breakouts + EP"
detail = "breakouts de leaders · EP Proba 3"
rule = "état de fond en expansion, marché non étendu, ratio mois entre {grade_b_rm} et {grade_a_rm}"

[[phases.phase]]
key = "exp_a"
name = "Expansion A"
color = "#2f6fc4"
setups = "Breakouts + EP"
detail = "breakouts de leaders en priorité · EP Proba 3"
rule = "état de fond en expansion, marché non étendu, ratio mois à {grade_a_rm} ou plus"

[[phases.phase]]
key = "hot"
name = "Expansion chaude"
color = "#8b7ae6"
setups = "Breakouts + EP"
detail = "breakouts de leaders, de préférence quand le momentum trimestre monte sur 5 séances · EP de qualité A+"
rule = "état de fond en expansion, marché étendu (ratio 5 jours au-dessus de {ext_on_r5} ou T2108 au-dessus de {ext_on_t2108} % ; fin quand le ratio 5 jours passe sous {ext_off_r5} et le T2108 sous {ext_off_t2108} %), sans surchauffe"

[[phases.phase]]
key = "overheat"
name = "Surchauffe"
color = "#cf5fa6"
setups = "EP + Breakouts A+"
detail = "EP Proba 3 · breakouts de qualité A+ · partiels sur ce qui est loin de sa moyenne mobile 10 jours (SMA 10)"
rule = "marché étendu avec un ratio 5 jours au-dessus de {hot_r5} ou un T2108 au-dessus de {hot_t2108} %"

[[phases.phase]]
key = "shock"
name = "Choc"
color = "#e5534b"
setups = "EP"
detail = "EP de qualité A+ · protection des gains : vendre 1/3 des gagnants, stop au point mort dès 1R (gain égal au risque initial), suivi sur la moyenne mobile 10 jours (SMA 10)"
rule = "au moins {choc_pct_100} % de l'univers en baisse de 4 % sur une des {choc_sessions} dernières séances"

[[phases.signal]]
key = "pre"
name = "Pré-expansion"
tip = "ratio 5 jours repassé au-dessus de {pre_r5} hors expansion : préparer la liste"

[[phases.signal]]
key = "pullback"
name = "Repli d'entrée"
tip = "expansion A, B ou C, ratio 5 jours entre {pullback_lo} et {pullback_hi} et plus bas qu'il y a {pullback_lag} séances : entrée breakout prioritaire (hypothèse)"

[[phases.signal]]
key = "sell_high"
name = "Ventes du mois : plus haut 3 mois"
tip = "part de l'univers en baisse de 25 % sur un mois au plus haut des {record_sessions} séances : rebond fragile, attendre la confirmation"

[[phases.signal]]
key = "sell_low"
name = "Ventes du mois : plus bas 3 mois"
tip = "part de l'univers en baisse de 25 % sur un mois au plus bas des {record_sessions} séances : la vente s'épuise, préparer la liste"

[[phases.signal]]
key = "rm_high"
name = "Ratio mois : plus haut 3 mois"
tip = "ratio mois (actions à +25 % ÷ actions à −25 % sur un mois) au plus haut des {record_sessions} séances : poussée confirmée"

