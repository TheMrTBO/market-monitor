name: Scan post-market (toutes les 15 min le soir)

# Relève seulement le scan post-market (fetch_postmarket.py, screener public TradingView, aucune clé) et republie le site.
# Le post-market US dure de 16 h à 20 h à New York, soit 20:00-00:00 UTC en heure d'été (EDT) et 21:00-01:00 UTC en heure
# d'hiver (EST) : les créneaux ci-dessous couvrent les deux ; hors fenêtre, le script ne fait rien (pas de commit).
# Le dernier relevé, après la fin du post-market, est fait par update.yml (05:43 UTC). Les tâches planifiées de GitHub
# partent souvent avec 5 à 30 min de retard : l'heure du relevé est affichée dans l'onglet.
on:
  schedule:
    # toutes les 15 min, à des minutes peu demandées (7, 22, 37, 52 : GitHub retarde ou saute plus souvent :00, :15, :30, :45)
    - cron: '7,22,37,52 20-23 * * 1-5'   # lun-ven, 20:07 -> 23:52 UTC
    - cron: '7,22,37,52 0 * * 2-6'       # 00:07 -> 00:52 UTC (soirée de la veille à New York)
    - cron: '7,22 1 * * 2-6'             # 01:07 et 01:22 UTC : fin du post-market en heure d'hiver
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: market-monitor          # même groupe que update.yml : jamais deux commits de données en même temps
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: main

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Relever le scan post-market (TradingView) et les graphiques (Yahoo)
        run: python fetch_postmarket.py

      - name: Contrôler le fichier (sinon retour à la dernière version valide)
        run: python validate_data.py postmarket || git checkout -- postmarket_data.js status_data.js

      - name: Enregistrer le scan
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add postmarket_data.js status_data.js   # status_data.js : heure du relevé (« pm »), lue par le bouton « Actualiser »
          if git diff --cached --quiet; then
            echo "Aucun changement (hors post-market ou scan identique)."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Scan post-market du $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 10))
          done
          echo "::error::Scan non poussé : main a changé pendant l'exécution (3 essais)."
          exit 1

      - name: Préparer le site
        if: steps.commit.outputs.changed == 'true'
        run: |
          mkdir -p _site
          cp index.html stockbee_dashboard.html config_data.js stockbee_data.js breadth_data.js prices_data.js vix_data.js sectors_data.js postmarket_data.js status_data.js _site/
          if [ -f industries_data.js ]; then cp industries_data.js _site/ && cp -r industries _site/; fi   # vue TradingView (onglet Secteurs)
          touch _site/.nojekyll

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5
        if: steps.commit.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        if: steps.commit.outputs.changed == 'true'
        with:
          path: _site

      # Stockage historique (refonte phase 3b) : les fichiers publiés sont recopiés sur la branche orpheline `data`
      # (ajout seul, upsert sans doublon, chaque ligne contrôlée). Un échec ici n'empêche pas la publication du site ;
      # il est signalé en fin de job. Voir ARCHITECTURE.md §4 bis et mm/store/sync.py.
      - name: Récupérer le stockage historique (branche data)
        id: store_checkout
        if: ${{ !cancelled() && steps.commit.outputs.changed == 'true' }}
        continue-on-error: true
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: data
          path: data-store

      - name: Synchroniser le stockage historique (branche data)
        id: store
        if: ${{ !cancelled() && steps.commit.outputs.changed == 'true' && steps.store_checkout.outcome == 'success' }}
        continue-on-error: true
        env:                                 # auteur des commits sur la branche data
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: python -m mm.store sync --only postmarket_data.js --message "Scan post-market du $(date -u '+%Y-%m-%d %H:%M UTC')"

      - name: Signaler un échec du stockage (le site est publié)
        if: steps.store_checkout.outcome == 'failure' || steps.store.outcome == 'failure'
        run: |
          echo "::error::Le stockage historique (branche data) n'a pas pu être mis à jour (voir « Synchroniser le stockage »)."
          exit 1

  deploy:
    needs: scan
    if: ${{ !cancelled() && needs.scan.outputs.changed == 'true' }}   # publie même si seul le stockage a échoué
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
