name: Thèmes ETF (compositions SEC, une fois par mois)

# Thèmes des actions d'après les ETF thématiques (fetch_etf_themes.py, config/etf_themes.toml) : dernière composition N-PORT de
# chaque ETF à la SEC (gratuit, sans clé ; contact exigé : secret SEC_UA « Nom contact@domaine »), contrôle, commit, republication.
# Même groupe de concurrence que les autres passages (jamais deux écritures en même temps) ; un échec garde le fichier publié.
on:
  schedule:
    - cron: '23 13 3 * *'       # le 3 de chaque mois (compositions trimestrielles, publiées ~60 jours après)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: market-monitor
  cancel-in-progress: false

jobs:
  themes:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      site: ${{ steps.site.outcome }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: main

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      # Fichiers générés (config/storage.toml [generated] : vue TradingView, index Tickers), jamais commités : repris du
      # cache de update.yml (mêmes chemins), sinon du site publié ; sans eux pas d'univers (fetch_short.py
      # lit tickers_data.js) ni de republication.
      - name: Restaurer les fichiers générés (cache hors dépôt)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            industries_data.js
            tickers_data.js
            industries
          key: generes-${{ github.run_id }}   # jamais trouvée : on prend le plus récent (restore-keys)
          restore-keys: generes-

      - name: Secours si le cache manque (version du site publié)
        continue-on-error: true
        run: python generated.py fetch     # ne télécharge que s'il manque un fichier

      - name: Lire les compositions des ETF (SEC, contact SEC_UA)
        id: fetch
        continue-on-error: true            # SEC indisponible ou SEC_UA absent : on garde le fichier publié
        env:
          SEC_UA: ${{ secrets.SEC_UA }}
        run: python fetch_etf_themes.py

      - name: Contrôler le fichier (sinon retour à la dernière version valide)
        run: python validate_data.py etf_themes || git checkout -- etf_themes_data.js 2>/dev/null || rm -f etf_themes_data.js

      - name: Enregistrer les thèmes ETF
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f etf_themes_data.js ]; then git add etf_themes_data.js; fi
          if git diff --cached --quiet; then
            echo "Aucun changement."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Thèmes ETF du $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 10))
          done
          echo "::error::Thèmes ETF non poussés : main a changé pendant l'exécution (3 essais)."
          exit 1

      - name: Préparer le site
        id: site
        if: steps.commit.outputs.changed == 'true'
        run: python generated.py check && python build_site.py   # liste des fichiers publiés : config/storage.toml [site]

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5
        if: steps.commit.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        if: steps.commit.outputs.changed == 'true'
        with:
          path: _site

      - name: Signaler un échec de la SEC (les thèmes publiés sont gardés)
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::error::Les thèmes ETF n'ont pas pu être lus (ou le secret SEC_UA manque) (voir « Lire les compositions »)."
          exit 1

  deploy:
    needs: themes
    if: ${{ !cancelled() && needs.themes.outputs.site == 'success' }}
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
