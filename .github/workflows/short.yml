name: Short interest (onglet Tickers, par lots l'après-midi)

# Rafraîchit un lot du short interest (fetch_short.py : flottant, actions à découvert, days to cover ; Yahoo Finance via
# yfinance, aucune clé), contrôle le fichier, le committe et republie le site. Passage séparé, l'après-midi (12:17 UTC) : loin
# de la mise à jour du matin et du scan post-market ; même groupe de concurrence (jamais deux écritures en même temps).
# Taille du lot, pauses, arrêt sur erreurs : config/short.toml. Un échec garde les valeurs déjà publiées.
on:
  schedule:
    - cron: '17 12 * * 1-6'      # secours de cron-job.org (config/schedule.toml)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: market-monitor
  cancel-in-progress: false

jobs:
  short:
    runs-on: ubuntu-24.04
    timeout-minutes: 30          # lot de 800 actions ≈ 7 min
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      site: ${{ steps.site.outcome }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: main

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      # Fichiers générés (config/storage.toml [generated] : vue TradingView, index Tickers), jamais commités : repris du
      # cache de update.yml (mêmes chemins), sinon du site publié ; sans eux pas d'univers (fetch_short.py
      # lit tickers_data.js) ni de republication.
      - name: Restaurer les fichiers générés (cache hors dépôt)
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: |
            industries_data.js
            tickers_data.js
            industries
          key: generes-${{ github.run_id }}   # jamais trouvée : on prend le plus récent (restore-keys)
          restore-keys: generes-

      - name: Secours si le cache manque (version du site publié)
        continue-on-error: true
        run: python generated.py fetch     # ne télécharge que s'il manque un fichier

      - name: Rafraîchir un lot du short interest (Yahoo)
        id: fetch
        continue-on-error: true            # Yahoo indisponible : on garde le fichier publié
        run: python fetch_short.py

      - name: Contrôler le fichier (sinon retour à la dernière version valide)
        run: python validate_data.py short || git checkout -- short_data.js 2>/dev/null || rm -f short_data.js

      - name: Enregistrer le short interest
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f short_data.js ]; then git add short_data.js; fi
          if git diff --cached --quiet; then
            echo "Aucun changement."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Short interest du $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 10))
          done
          echo "::error::Short interest non poussé : main a changé pendant l'exécution (3 essais)."
          exit 1

      - name: Préparer le site
        id: site
        if: steps.commit.outputs.changed == 'true'
        run: python generated.py check && python build_site.py   # liste des fichiers publiés : config/storage.toml [site]

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5
        if: steps.commit.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        if: steps.commit.outputs.changed == 'true'
        with:
          path: _site

      - name: Signaler un échec de Yahoo (les valeurs publiées sont gardées)
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::error::Le short interest n'a pas pu être rafraîchi (voir « Rafraîchir un lot »)."
          exit 1

  deploy:
    needs: short
    if: ${{ !cancelled() && needs.short.outputs.site == 'success' }}
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
