name: Mise à jour des données et publication

# Gratuit sur un dépôt public (Actions illimité, GitHub Pages inclus). Aucune clé API : toutes les sources sont publiques.
on:
  schedule:
    - cron: '17 22 * * *'     # 22:17 UTC, tous les jours : 1 h 17 à 2 h 17 après la clôture US (minute décalée : moins de retards) ; le BTC cote le week-end
    - cron: '43 5 * * *'      # 05:43 UTC le lendemain : rattrapage si une source (Stockbee, CBOE, Yahoo) a échoué ou publié tard
  workflow_dispatch:           # lancement manuel : onglet Actions > « Run workflow »
  push:
    branches: [main]
    paths: ['.github/workflows/update.yml', 'stockbee_dashboard.html', 'index.html']

permissions:
  contents: write              # commit des fichiers de données
  pages: write
  id-token: write

concurrency:
  group: market-monitor
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Récupérer les données (Stockbee, VIX, prix, ETF sectoriels)
        id: fetch
        continue-on-error: true            # on publie quand même ce qui a été mis à jour ; l'échec reste signalé plus bas
        run: python update_all.py

      - name: Contrôler la cohérence des données avant publication
        id: validate
        continue-on-error: true
        run: python validate_data.py

      - name: Annuler les fichiers invalides (retour aux dernières données valides du dépôt)
        if: steps.validate.outcome == 'failure'
        run: git checkout -- stockbee_data.js stockbee_market_monitor.csv prices_data.js vix_data.js sectors_data.js

      - name: Enregistrer les données (dernières bonnes valeurs conservées en cas d'échec d'une source)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stockbee_data.js stockbee_market_monitor.csv prices_data.js vix_data.js sectors_data.js status_data.js
          if git diff --cached --quiet; then
            echo "Aucun changement de données."
          else
            git commit -m "Données du $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: Préparer le site
        run: |
          mkdir -p _site
          cp index.html stockbee_dashboard.html stockbee_data.js prices_data.js vix_data.js sectors_data.js status_data.js _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: _site

      - name: Signaler un échec de source (le site est publié avec les dernières données valides)
        if: steps.fetch.outcome == 'failure' || steps.validate.outcome == 'failure'
        run: |
          echo "::error::Au moins une source n'a pas pu être mise à jour (voir l'étape « Récupérer les données »)."
          exit 1

  deploy:
    needs: update
    if: always() && needs.update.result != 'cancelled' && needs.update.result != 'skipped'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
