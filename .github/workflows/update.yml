name: Mise à jour des données et publication

# Gratuit sur un dépôt public (Actions illimité, GitHub Pages inclus). Une seule clé : POLYGON_API_KEY (GitHub Secret,
# plan gratuit Polygon / Massive), utilisée par fetch_history.py pour le calcul maison du breadth. Toutes les autres sources sont publiques.
on:
  schedule:
    - cron: '17 22 * * *'     # 22:17 UTC, tous les jours : 1 h 17 à 2 h 17 après la clôture US (minute décalée : moins de retards) ; le BTC cote le week-end
    - cron: '17 1 * * *'      # 01:17 et 03:17 UTC : nouveaux essais pour le breadth du jour (Stockbee, Polygon, CBOE publient après la clôture,
    - cron: '17 3 * * *'      #   à une heure variable) ; le tableau de bord affiche « en attente des données » d'ici là
    - cron: '43 5 * * *'      # 05:43 UTC le lendemain : rattrapage si une source (Stockbee, CBOE, Yahoo) a échoué ou publié tard
  workflow_dispatch:           # lancement manuel : onglet Actions > « Run workflow »
  push:
    branches: [main]
    paths: ['.github/workflows/update.yml', 'stockbee_dashboard.html', 'index.html', 'config_data.js', 'config/**', '*.py', 'mm/**']   # code ou config modifiés : republication

permissions:
  contents: write              # commit des fichiers de données (sauf fichiers générés : cache Actions)
  pages: write
  id-token: write

concurrency:
  group: market-monitor
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04   # version fixe : « ubuntu-latest » migre vers Ubuntu 26 à partir du 19 oct. 2026
    timeout-minutes: 60       # rattrapage d'historique : au plus 100 séances par passage (~20 min, config/sources.toml) ; ensuite 1-2 appels
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: main                # dernière version de main, même pour un « Re-run » (sinon : ancien commit, push refusé)

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      # Historique des clôtures (agrégé en breadth_data.js) : jamais committé, seulement mis en cache entre deux exécutions.
      - name: Restaurer l'historique des clôtures (cache hors dépôt)
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: cache
          key: historique-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: historique-        # le plus récent cache, quel que soit le passage

      - name: Compléter l'historique des clôtures (Polygon / Massive)
        id: history
        continue-on-error: true            # sans ce téléchargement, les autres sources et l'ancien calcul maison restent publiés
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: python fetch_history.py   # profondeur et plafond par passage : config/sources.toml [history] (190 séances, 100 par passage)
        # cache d'avant l'OHLC (ouverture, plus haut, plus bas) : chaque séance est retéléchargée une fois (~27 min au 1er passage)

      - name: Sauvegarder l'historique des clôtures
        if: always() && hashFiles('cache/**') != ''   # rien à sauvegarder si le téléchargement a échoué avant de créer le dossier
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: cache
          key: historique-${{ github.run_id }}-${{ github.run_attempt }}   # une clé par tentative : un « Re-run » ne bute plus sur un cache existant (409)

      # Fichiers générés (config/storage.toml [generated] : vue TradingView, index Tickers) : jamais commités (~2,7 Mo
      # d'historique Git par séance), gardés d'un passage à l'autre par ce cache. fetch_industries.py y relit la composition
      # publiée (séance déjà publiée, secours si TradingView ne répond pas). Mêmes chemins dans les trois workflows.
      - name: Restaurer les fichiers générés (cache hors dépôt)
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: |
            industries_data.js
            tickers_data.js
            industries
          key: generes-${{ github.run_id }}   # jamais trouvée : on prend le plus récent (restore-keys)
          restore-keys: generes-

      - name: Secours si le cache manque (version du site publié)
        continue-on-error: true            # site injoignable : fetch_industries.py refait un scan TradingView complet
        run: python generated.py fetch     # ne télécharge que s'il manque un fichier

      - name: Copier les fichiers générés (annulation possible si le contrôle échoue)
        run: python generated.py snapshot "$RUNNER_TEMP/generes"

      - name: Récupérer les données (Stockbee, calcul maison, VIX, prix, ETF sectoriels, scan post-market, industries TradingView)
        id: fetch
        continue-on-error: true            # on publie quand même ce qui a été mis à jour ; l'échec reste signalé plus bas
        run: python update_all.py

      - name: Contrôler la cohérence des données avant publication
        id: validate
        continue-on-error: true
        run: python validate_data.py

      - name: Annuler les fichiers invalides (retour aux dernières données valides du dépôt)
        if: steps.validate.outcome == 'failure'
        run: |
          git checkout -- stockbee_data.js stockbee_market_monitor.csv breadth_data.js prices_data.js vix_data.js sectors_data.js postmarket_data.js
          git checkout -- tv_breadth_data.js 2>/dev/null || rm -f tv_breadth_data.js   # T2108 TradingView (ajouté le 20/10/2026)
          # fichiers générés (non versionnés) : retour à la copie d'avant update_all.py (cache ou site publié), fichiers
          # nouveaux retirés ; aucune copie (premier passage sans cache ni site) : le produit invalide est retiré
          python generated.py restore "$RUNNER_TEMP/generes"

      # Clé = contenu : un passage qui ne change rien (même séance) ne crée pas de nouvelle entrée de cache.
      - name: Sauvegarder les fichiers générés (cache hors dépôt)
        if: ${{ !cancelled() && hashFiles('industries_data.js') != '' }}
        continue-on-error: true            # cache déjà existant (même contenu) ou indisponible : secours = site publié
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            industries_data.js
            tickers_data.js
            industries
          key: generes-${{ hashFiles('industries_data.js', 'tickers_data.js', 'industries/*.js') }}

      - name: Enregistrer les données (dernières bonnes valeurs conservées en cas d'échec d'une source)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stockbee_data.js stockbee_market_monitor.csv breadth_data.js prices_data.js vix_data.js sectors_data.js postmarket_data.js status_data.js
          if [ -f tv_breadth_data.js ]; then git add tv_breadth_data.js; fi                 # T2108 TradingView
          if git diff --cached --quiet; then
            echo "Aucun changement de données."
          else
            git commit -m "Données du $(date -u '+%Y-%m-%d %H:%M UTC')"
            # main a pu avancer pendant l'exécution (fusion de PR, autre passage) : on rejoue notre commit par-dessus ;
            # en cas de conflit sur un fichier de données, nos données (calculées à l'instant) l'emportent (-X theirs en rebase)
            for i in 1 2 3; do
              if git pull --rebase -X theirs origin main && git push origin HEAD:main; then exit 0; fi
              git rebase --abort 2>/dev/null || true
              sleep $((i * 10))
            done
            echo "::error::Données non poussées : main a changé pendant l'exécution (3 essais)."
            exit 1
          fi

      # Stockage historique (refonte phase 3b) : les fichiers publiés sont recopiés sur la branche orpheline `data`
      # (ajout seul, upsert sans doublon, chaque ligne contrôlée). Un échec ici n'empêche pas la publication du site ;
      # il est signalé en fin de job. Voir ARCHITECTURE.md §4 bis et mm/store/sync.py.
      - name: Récupérer le stockage historique (branche data)
        id: store_checkout
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: data
          path: data-store

      - name: Synchroniser le stockage historique (branche data)
        id: store
        if: ${{ !cancelled() && steps.store_checkout.outcome == 'success' }}
        continue-on-error: true
        env:                                 # auteur des commits sur la branche data
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: python -m mm.store sync --run-id "${{ github.run_id }}-${{ github.run_attempt }}" --message "Données du $(date -u '+%Y-%m-%d %H:%M UTC') (mise à jour)"

      - name: Vérifier les fichiers générés (sinon Secteurs / TradingView et Tickers publiés sans données)
        id: generated
        continue-on-error: true
        run: python generated.py check

      - name: Préparer le site
        run: python build_site.py   # liste des fichiers publiés : config/storage.toml [site]

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: _site

      - name: Signaler un échec de source (le site est publié avec les dernières données valides)
        if: steps.fetch.outcome == 'failure' || steps.validate.outcome == 'failure' || steps.history.outcome == 'failure' || steps.store_checkout.outcome == 'failure' || steps.store.outcome == 'failure' || steps.generated.outcome == 'failure'
        run: |
          echo "::error::Au moins une source ou le stockage historique n'a pas pu être mis à jour (voir les étapes « Compléter l'historique », « Récupérer les données », « Vérifier les fichiers générés » et « Synchroniser le stockage »)."
          exit 1

  deploy:
    needs: update
    if: always() && needs.update.result != 'cancelled' && needs.update.result != 'skipped'
    runs-on: ubuntu-24.04   # version fixe : « ubuntu-latest » migre vers Ubuntu 26 à partir du 19 oct. 2026
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
